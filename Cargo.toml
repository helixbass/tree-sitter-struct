[package]
name = "tree-sitter-struct"
version = "0.1.0"
edition = "2024"

[dependencies]
heck = "0.5.0"
indexmap = { version = "2.13.0", features = ["serde"] }
proc-macro2 = "1.0.105"
quote = "1.0.43"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"

[dev-dependencies]
clap = { version = "4.5.54", features = ["derive"] }
